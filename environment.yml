name: hr-pipeline
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - bakta=1.12.1          # stage 01 (database v6.0 light, installed separately)
  - ncbi-amrfinderplus    # stage 01 (version as run not recoverable)
  - bcftools=1.24         # stage 03 (htslib 1.24)
  - samtools=1.24         # stages 02-03
  - bedtools              # stage 02
  - mash                  # stage 04 (k / sketch size not recoverable)
  - pysam                 # stage 05
  - pandas
  - numpy
  - scipy
  - matplotlib
  - openpyxl
  - biopython             # stage 06 structural metrics
  # stage 06 scoring, installed with pip: fair-esm (esm2_t33_650M_UR50D), torch
