name: hr-pipeline
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - flye=2.9.6            # stage 00 (--nano-hq, --genome-size 5m; recovered 2026-09-04)
  - minimap2=2.31         # stage 02 (-ax map-ont -I 1G -K 100M; recovered 2026-09-04)
  - bakta=1.12.1          # stage 01 (database v6.0 light, installed separately)
  - ncbi-amrfinderplus    # stage 01 (version as run not recoverable)
  - bcftools=1.24         # stage 03 (htslib 1.24)
  - samtools=1.24         # stages 02-03
  - bedtools              # stage 02
  - mash=2.3              # stage 04 (k=21, sketch size 200000; recovered 2026-09-04)
  - pysam                 # stage 05
  - pandas
  - numpy
  - scipy
  - matplotlib
  - openpyxl
  - biopython             # stage 06 structural metrics
  # stage 06 scoring, installed with pip: fair-esm (esm2_t33_650M_UR50D), torch
